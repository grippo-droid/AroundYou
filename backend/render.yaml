services:
  - type: web
    name: aroundyou-backend
    env: python
    # Download the embedding model at build time so the server never fetches
    # it at runtime (free-tier disk is rebuilt each deploy, no build cache).
    buildCommand: pip install -r requirements.txt && python scripts/download_embedding_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: around_you_db
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
